<title>Школа щитовика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Прикладная электрика и сборка электрощитов с нуля: курс, формулы, нормы, проекты, игры, конструктор щита и разборы от Claude.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" data-gfont>
<style>
/* Layout: GitHub-style app shell — dark top header with HUD (level, XP strip), one content column, bottom tab bar on phones, left side nav from 1012px.
   Identity: GitHub Primer surfaces and type; game accents only where progress lives — gold XP, purple level, rarity colours, pixel font for numbers. */
:root{
  --bg:#ffffff; --bg-subtle:#f6f8fa; --bg-inset:#f6f8fa; --bg-muted:#eff2f5; --overlay:#ffffff;
  --fg:#1f2328; --fg-muted:#59636e; --fg-subtle:#6e7781;
  --border:#d1d9e0; --border-muted:#dfe4e9; --border-strong:#bcc5ce;
  --accent:#0969da; --accent-subtle:#ddf4ff; --accent-muted:rgba(84,174,255,.4);
  --success:#1a7f37; --success-em:#1f883d; --success-subtle:#dafbe1;
  --attention:#9a6700; --attention-em:#bf8700; --attention-subtle:#fff8c5;
  --severe:#bc4c00; --severe-subtle:#fff1e5;
  --danger:#d1242f; --danger-subtle:#ffebe9;
  --done:#8250df; --done-subtle:#fbefff;
  --sponsors:#bf3989; --sponsors-subtle:#ffeff7;
  --hdr-bg:#24292f; --hdr-fg:#ffffff; --hdr-muted:rgba(255,255,255,.72); --hdr-hover:rgba(255,255,255,.12); --hdr-line:rgba(255,255,255,.16);
  --unl:#fd8c73;
  --btn-bg:#f6f8fa; --btn-hover:#eff2f5; --btn-active:#e6eaef; --btn-border:#d1d9e0;
  --btn-pri:#1f883d; --btn-pri-hover:#1c8139; --btn-pri-fg:#ffffff;
  --shadow-sm:0 1px 0 rgba(31,35,40,.04); --shadow-md:0 3px 6px rgba(140,149,159,.15); --shadow-lg:0 8px 24px rgba(140,149,159,.2); --shadow-xl:0 12px 28px rgba(140,149,159,.3);
  --h0:#eff2f5; --h1:#aceebb; --h2:#4ac26b; --h3:#2da44e; --h4:#116329;
  --gold:#bf8700; --xp-a:#ffd33d; --xp-b:#fb8f44; --lvl-a:#8250df; --lvl-b:#bf3989; --flame:#fb8500;
  --r-c:#6e7781; --r-r:#0969da; --r-e:#8250df; --r-l:#bf8700;
  --cyan:#0e7490; --cyan-subtle:#e4f6fa;
  /* старые имена, на которых нарисованы схемы и иллюстрации */
  --surface:var(--bg); --surface-2:var(--bg-subtle); --surface-3:var(--bg-muted);
  --ink:var(--fg); --ink-2:var(--fg-muted); --ink-3:var(--fg-subtle); --line:var(--border); --line-2:var(--border-strong);
  --signal:#F2B705; --signal-ink:#17130A; --signal-soft:var(--attention-subtle);
  --ok:var(--success); --ok-soft:var(--success-subtle); --warn:var(--attention); --warn-soft:var(--attention-subtle); --bad:var(--danger); --bad-soft:var(--danger-subtle); --info-soft:var(--accent-subtle);
  --w-l1:#8A5426; --w-l2:#1D1D1D; --w-l3:#8E9497; --w-n:#2A6CD6; --w-pe:#2F9B4A; --w-pey:#E2BE14; --w-edge:rgba(20,25,22,.28);
  --dev:#FFFFFF; --dev-2:#F1F2EF; --dev-line:#98A09A; --rail:#AEB4AF; --enc:#E4E8EC; --enc-line:#B5BEC7;
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  --font-display:var(--font-body);
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --font-pixel:"Press Start 2P",ui-monospace,monospace;
  --r:6px; --r-lg:12px; --hdr:56px; --tabh:60px; --shadow:var(--shadow-md);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1117; --bg-subtle:#151b23; --bg-inset:#010409; --bg-muted:#212830; --overlay:#151b23;
    --fg:#f0f6fc; --fg-muted:#9198a1; --fg-subtle:#7d8590;
    --border:#3d444d; --border-muted:#2f353d; --border-strong:#4d555e;
    --accent:#4493f8; --accent-subtle:rgba(56,139,253,.15); --accent-muted:rgba(56,139,253,.4);
    --success:#3fb950; --success-em:#238636; --success-subtle:rgba(46,160,67,.15);
    --attention:#d29922; --attention-em:#9e6a03; --attention-subtle:rgba(187,128,9,.15);
    --severe:#db6d28; --severe-subtle:rgba(219,109,40,.12);
    --danger:#f85149; --danger-subtle:rgba(248,81,73,.12);
    --done:#ab7df8; --done-subtle:rgba(171,125,248,.15);
    --sponsors:#db61a2; --sponsors-subtle:rgba(219,97,162,.12);
    --hdr-bg:#010409; --hdr-line:rgba(240,246,252,.1);
    --btn-bg:#212830; --btn-hover:#262c36; --btn-active:#2a313c; --btn-border:#3d444d;
    --btn-pri:#238636; --btn-pri-hover:#29903b;
    --shadow-sm:0 0 transparent; --shadow-md:0 3px 6px #010409; --shadow-lg:0 8px 24px #010409; --shadow-xl:0 12px 48px #010409;
    --h0:#1b222c; --h1:#033a16; --h2:#196c2e; --h3:#2ea043; --h4:#56d364;
    --gold:#e3b341; --xp-a:#f2cc60; --xp-b:#f0883e; --lvl-a:#a371f7; --lvl-b:#db61a2; --flame:#ff9e3d;
    --r-c:#8b949e; --r-r:#4493f8; --r-e:#ab7df8; --r-l:#e3b341;
    --cyan:#22d3ee; --cyan-subtle:rgba(34,211,238,.12);
    --w-l1:#B0703A; --w-l2:#0B0B0B; --w-l3:#9AA0A3; --w-n:#4A8BF0; --w-pe:#3DB25B; --w-pey:#E8C824; --w-edge:rgba(235,240,236,.55);
    --dev:#F2F3F0; --dev-2:#DCDFDA; --dev-line:#8D958F; --rail:#5F6862; --enc:#1b222c; --enc-line:#3d444d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1117; --bg-subtle:#151b23; --bg-inset:#010409; --bg-muted:#212830; --overlay:#151b23;
  --fg:#f0f6fc; --fg-muted:#9198a1; --fg-subtle:#7d8590;
  --border:#3d444d; --border-muted:#2f353d; --border-strong:#4d555e;
  --accent:#4493f8; --accent-subtle:rgba(56,139,253,.15); --accent-muted:rgba(56,139,253,.4);
  --success:#3fb950; --success-em:#238636; --success-subtle:rgba(46,160,67,.15);
  --attention:#d29922; --attention-em:#9e6a03; --attention-subtle:rgba(187,128,9,.15);
  --severe:#db6d28; --severe-subtle:rgba(219,109,40,.12);
  --danger:#f85149; --danger-subtle:rgba(248,81,73,.12);
  --done:#ab7df8; --done-subtle:rgba(171,125,248,.15);
  --sponsors:#db61a2; --sponsors-subtle:rgba(219,97,162,.12);
  --hdr-bg:#010409; --hdr-line:rgba(240,246,252,.1);
  --btn-bg:#212830; --btn-hover:#262c36; --btn-active:#2a313c; --btn-border:#3d444d;
  --btn-pri:#238636; --btn-pri-hover:#29903b;
  --shadow-sm:0 0 transparent; --shadow-md:0 3px 6px #010409; --shadow-lg:0 8px 24px #010409; --shadow-xl:0 12px 48px #010409;
  --h0:#1b222c; --h1:#033a16; --h2:#196c2e; --h3:#2ea043; --h4:#56d364;
  --gold:#e3b341; --xp-a:#f2cc60; --xp-b:#f0883e; --lvl-a:#a371f7; --lvl-b:#db61a2; --flame:#ff9e3d;
  --r-c:#8b949e; --r-r:#4493f8; --r-e:#ab7df8; --r-l:#e3b341;
  --cyan:#22d3ee; --cyan-subtle:rgba(34,211,238,.12);
  --w-l1:#B0703A; --w-l2:#0B0B0B; --w-l3:#9AA0A3; --w-n:#4A8BF0; --w-pe:#3DB25B; --w-pey:#E8C824; --w-edge:rgba(235,240,236,.55);
  --dev:#F2F3F0; --dev-2:#DCDFDA; --dev-line:#8D958F; --rail:#5F6862; --enc:#1b222c; --enc-line:#3d444d;
  color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-sizing:border-box}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- шапка, HUD, навигация ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:6px;background:var(--hdr-bg);color:var(--hdr-fg);
  min-height:var(--hdr);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;color:var(--hdr-fg);min-width:0;padding:4px 6px 4px 2px;border-radius:6px}
.brand:hover{color:var(--hdr-muted)}
.brand b{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand svg{flex:none}
.topbar .spacer{flex:1}
.hbtn{position:relative;display:inline-grid;place-items:center;width:38px;height:38px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--hdr-fg);cursor:pointer;flex:none}
.hbtn:hover{background:var(--hdr-hover)}
.hbtn .ic{width:20px;height:20px}
.hbtn .pip{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--hdr-bg)}
.hbtn.outlined{border-color:var(--hdr-line)}
.me-btn{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 3px;border-radius:999px;border:1px solid var(--hdr-line);background:transparent;cursor:pointer;color:var(--hdr-fg);flex:none}
.me-btn:hover{background:var(--hdr-hover)}
.me-btn .ava{width:28px;height:28px}
.me-btn .lv{font-family:var(--font-pixel);font-size:9px;line-height:1;padding:4px 6px 3px;border-radius:999px;background:linear-gradient(135deg,var(--lvl-a),var(--lvl-b));color:#fff;letter-spacing:.02em}
.xpstrip{position:sticky;top:calc(var(--hdr) + env(safe-area-inset-top,0px));z-index:29;height:3px;background:var(--hdr-bg)}
.xpstrip>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--xp-a),var(--xp-b));box-shadow:0 0 8px var(--xp-b);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg);border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:var(--tabh);font-size:11px;font-weight:500;color:var(--fg-muted);position:relative;min-width:0}
.tab .ic{width:22px;height:22px}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.tab.x{display:none}
@media (max-width:420px){.tab{font-size:10px}.tab .ic{width:20px;height:20px}}
.tab[aria-current="page"]{color:var(--fg);font-weight:600}
.tab[aria-current="page"] .ic{color:var(--accent)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:24%;right:24%;height:2px;border-radius:0 0 2px 2px;background:var(--unl)}
.tab .cnt{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--accent);color:#fff;font-size:10px;font-weight:600;line-height:16px;text-align:center}
.side-me{display:none}
main{display:block;min-height:60vh}
.wrap{max-width:920px;margin:0 auto;padding-block:20px calc(var(--tabh) + 44px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap.wide{max-width:1280px}
@media (max-width:350px){.brand b{display:none}}
@media (min-width:1012px){
  .tabs{top:calc(var(--hdr) + 3px);bottom:0;right:auto;width:248px;display:flex;flex-direction:column;gap:2px;padding:16px 12px;border-top:0;border-right:1px solid var(--border-muted);background:var(--bg);overflow-y:auto}
  .tab,.tab.x{display:flex;flex-direction:row;justify-content:flex-start;gap:10px;height:36px;padding:0 10px;border-radius:6px;font-size:14px;color:var(--fg);font-weight:400}
  .tab:hover{background:var(--bg-muted)}
  .tab .ic{width:16px;height:16px;color:var(--fg-muted)}
  .tab[aria-current="page"]{background:var(--bg-muted);font-weight:600}
  .tab[aria-current="page"]::before{top:6px;bottom:6px;left:-12px;right:auto;width:4px;height:auto;border-radius:0 6px 6px 0;background:var(--accent)}
  .tab .cnt{position:static;margin-left:auto}
  .tab.sep{margin-top:14px}
  .side-me{display:block;margin-top:auto;padding-top:16px}
  main{margin-left:248px}
  .wrap{padding-bottom:64px;padding-left:32px;padding-right:32px}
}

/* ---------- текст ---------- */
h1,h2,h3,h4{text-wrap:balance;line-height:1.25;margin:0}
.h1{font-weight:600;font-size:clamp(22px,5.6vw,30px);letter-spacing:-.01em}
.h2{font-size:20px;font-weight:600}
.h3{font-size:16px;font-weight:600}
.eyebrow{font-size:12px;font-weight:600;color:var(--fg-muted)}
.muted{color:var(--fg-muted)}
.small{font-size:13px}
.mono{font-family:var(--font-mono);font-size:.9em}
.px{font-family:var(--font-pixel);font-weight:400;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-sm{display:flex;flex-direction:column;gap:8px}
.stack-lg{display:flex;flex-direction:column;gap:28px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.page-head{display:flex;flex-direction:column;gap:6px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border-muted)}
.crumbs{font-size:14px;color:var(--fg-muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumbs a{color:var(--accent)}
.crumbs a:hover{text-decoration:underline}
.sec-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:10px}
.sec-title .ic{color:var(--fg-muted)}
.sec-title a{margin-left:auto;font-size:13px;font-weight:400}

/* ---------- урок как README ---------- */
.prose{max-width:76ch;font-size:16px;line-height:1.6;overflow-wrap:break-word}
.prose>*+*{margin-top:16px}
.prose h2{font-size:1.45em;font-weight:600;margin-top:32px;padding-bottom:.3em;border-bottom:1px solid var(--border-muted)}
.prose h3{font-size:1.2em;font-weight:600;margin-top:24px}
.prose ul,.prose ol{padding-left:2em;margin-block:8px 0}
.prose li+li{margin-top:6px}
.prose a,.lnk{color:var(--accent);text-decoration:underline;text-underline-offset:.2em;text-decoration-thickness:1px;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.prose a:hover,.lnk:hover{text-decoration-thickness:2px}
.prose strong{font-weight:600}
.prose code,.k{font-family:var(--font-mono);font-size:85%;background:var(--bg-muted);border-radius:6px;padding:.2em .4em;white-space:nowrap}
dfn,.term{font-style:normal;border-bottom:1px dashed var(--accent);cursor:help}
.lead{font-size:18px;color:var(--fg-muted)}
.box{border-left:4px solid var(--border-strong);padding:8px 16px 10px;border-radius:0 6px 6px 0;background:var(--bg-subtle);font-size:15px}
.box>.lbl{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;line-height:1.3;margin-bottom:6px;color:var(--fg-muted)}
.box>.lbl .ic{width:16px;height:16px}
.box>*+*:not(.lbl){margin-top:8px}
.box ul,.box ol{padding-left:20px;margin:6px 0 0}
.box.tip{border-color:var(--success);background:var(--success-subtle)} .box.tip>.lbl{color:var(--success)}
.box.warn{border-color:var(--attention-em);background:var(--attention-subtle)} .box.warn>.lbl{color:var(--attention)}
.box.bad{border-color:var(--danger);background:var(--danger-subtle)} .box.bad>.lbl{color:var(--danger)}
.box.norm{border-color:var(--done);background:var(--done-subtle)} .box.norm>.lbl{color:var(--done)}
.box.anki{border-color:var(--accent);background:var(--accent-subtle)} .box.anki>.lbl{color:var(--accent)} .box.anki .row{margin-top:10px}
.box.skill{border-color:var(--accent);background:var(--accent-subtle)} .box.skill>.lbl{color:var(--accent)}
.box.ex{border-color:var(--border-strong);background:var(--bg-subtle)}
.box.goal{border-color:var(--accent);background:var(--accent-subtle)} .box.goal>.lbl{color:var(--accent)}
.box.phys{border-color:var(--cyan);background:var(--cyan-subtle)} .box.phys>.lbl{color:var(--cyan)}
.box.hist{border-color:var(--sponsors);background:var(--sponsors-subtle)} .box.hist>.lbl{color:var(--sponsors)}
.prob{display:flex;flex-direction:column;gap:10px}
.prob .pq>*+*{margin-top:8px}
.prob details{border-top:1px solid var(--border-muted);padding-top:8px}
.prob summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.prob .sol{margin-top:8px;display:flex;flex-direction:column;gap:8px;font-size:15px}
.prob .sol ol,.prob .sol ul{padding-left:22px;margin:0}
.fx{font-family:var(--font-mono);font-size:18px;font-weight:600;background:var(--bg-subtle);border:1px solid var(--border-muted);border-radius:6px;padding:14px 16px;text-align:center;overflow-x:auto;white-space:nowrap}
.fx sub,.fx sup{font-size:.68em}
figure{margin:0}
figure.ill{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;overflow-x:auto}
figure.ill svg{display:block;max-width:100%;height:auto;margin:0 auto}
figure.ill figcaption{font-size:13px;color:var(--fg-muted);margin-top:8px;text-align:center}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:15px}
.kv dt{font-family:var(--font-mono);font-weight:600}
.kv dd{margin:0;color:var(--fg-muted)}
.md>*+*{margin-top:10px}
.md h4{font-size:15px;font-weight:600;margin-top:14px}
.md ul,.md ol{padding-left:22px;margin:0}
.md li+li{margin-top:4px}
pre.code{background:var(--bg-subtle);border:1px solid var(--border-muted);border-radius:6px;padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;line-height:1.45;white-space:pre;margin:8px 0}
.md pre,.msg pre{background:var(--bg-subtle);border:1px solid var(--border-muted);border-radius:6px;padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;white-space:pre}
.md blockquote,.msg blockquote{margin:0;padding:0 12px;border-left:4px solid var(--border-strong);color:var(--fg-muted)}
.md a,.msg.ai a{color:var(--accent);text-decoration:underline}
.md hr,.msg hr{border:0;border-top:1px solid var(--border-muted)}

/* ---------- компоненты GitHub ---------- */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px;color:var(--fg)}
a.card,button.card{display:block;text-align:left;width:100%;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
a.card:hover,button.card:hover{border-color:var(--border-strong);box-shadow:var(--shadow-md)}
@media (hover:hover){a.card:hover,button.card:hover{transform:translateY(-1px)}}
.card .ttl{color:var(--accent);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border-radius:6px;border:1px solid var(--btn-border);
  background:var(--btn-bg);color:var(--fg);cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap;box-shadow:var(--shadow-sm);transition:background .1s ease}
.btn:hover{background:var(--btn-hover);text-decoration:none}
.btn:active{background:var(--btn-active)}
.btn .ic{width:16px;height:16px;color:var(--fg-muted)}
.btn.primary{background:var(--btn-pri);color:var(--btn-pri-fg);border-color:rgba(31,35,40,.15)}
.btn.primary:hover{background:var(--btn-pri-hover)}
.btn.primary .ic{color:inherit}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none;color:var(--accent)}
.btn.ghost:hover{background:var(--bg-muted)}
.btn.ghost .ic{color:inherit}
.btn.danger{color:var(--danger)}
.btn.danger .ic{color:inherit}
.btn.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
.btn.wrap{white-space:normal;text-align:left;line-height:1.3;padding-block:9px;min-width:0}
.btn.game{position:relative;border:0;color:#1b1300;font-weight:700;background:linear-gradient(180deg,#ffe066,#f6b40e);box-shadow:0 3px 0 #b8800a,0 6px 16px rgba(246,180,14,.3);min-height:46px;padding:0 20px;font-size:15px}
.btn.game:hover{filter:brightness(1.05);background:linear-gradient(180deg,#ffe57a,#f8bb1f)}
.btn.game:active{transform:translateY(2px);box-shadow:0 1px 0 #b8800a}
.btn.game .ic{color:inherit}
.btn.purple{border:0;color:#fff;background:linear-gradient(135deg,var(--lvl-a),var(--lvl-b));box-shadow:0 3px 0 rgba(0,0,0,.25)}
.btn.purple .ic{color:#fff}
.lesson-nav{display:flex;gap:10px;flex-wrap:nowrap}
.lesson-nav .btn{flex:1 1 0;justify-content:flex-start}
.lesson-nav .btn.nx{justify-content:flex-end;text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;line-height:20px;padding:0 8px;border-radius:2em;border:1px solid var(--border);color:var(--fg-muted);white-space:nowrap;background:transparent}
.badge .ic{width:12px;height:12px}
.badge.y{background:var(--signal);color:var(--signal-ink);border-color:transparent}
.badge.ok{color:var(--success);border-color:color-mix(in srgb,var(--success) 45%,transparent)}
.badge.warn{color:var(--attention);border-color:color-mix(in srgb,var(--attention) 45%,transparent)}
.badge.bad{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.badge.info{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.badge.done{color:var(--done);border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.badge.fill-ok{background:var(--success-em);border-color:transparent;color:#fff}
.badge.fill-done{background:var(--done);border-color:transparent;color:#fff}
.badge.xp{font-family:var(--font-pixel);font-size:9px;letter-spacing:.02em;line-height:18px;color:#5c3d00;background:linear-gradient(90deg,var(--xp-a),var(--xp-b));border:0;padding:1px 7px 0}
.badge.xp.got{background:var(--bg-muted);color:var(--fg-subtle)}
.counter{display:inline-block;min-width:20px;padding:0 6px;font-size:12px;font-weight:500;line-height:18px;text-align:center;border-radius:2em;background:var(--bg-muted);color:var(--fg)}
.counter.blue{background:var(--accent);color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--btn-border);background:var(--btn-bg);border-radius:2em;padding:6px 12px;font-size:14px;cursor:pointer;line-height:1.3;text-align:left;color:var(--fg)}
.chip:hover{background:var(--btn-hover)}
.chip[aria-pressed="true"]{background:var(--accent-subtle);color:var(--accent);border-color:var(--accent)}
.topic{display:inline-block;font-size:12px;font-weight:500;line-height:22px;padding:0 10px;border-radius:2em;background:var(--accent-subtle);color:var(--accent)}
.bar{height:8px;border-radius:6px;background:var(--bg-muted);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--success-em);border-radius:6px;transition:width .5s ease}
.bar.xp{height:12px;border-radius:3px;background:var(--bg-muted);box-shadow:inset 0 0 0 1px var(--border-muted)}
.bar.xp>i{border-radius:3px;background:linear-gradient(90deg,var(--xp-a),var(--xp-b));box-shadow:0 0 10px color-mix(in srgb,var(--xp-b) 60%,transparent)}
.list{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);overflow:hidden}
.list-head{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--bg-subtle);border-bottom:1px solid var(--border);font-size:14px}
.list-head b{font-weight:600}
.li{display:flex;align-items:center;gap:12px;padding:12px 16px;border:0;background:none;text-align:left;width:100%;cursor:pointer;color:var(--fg)}
.li+.li{border-top:1px solid var(--border-muted)}
.list-head+.li{border-top:0}
a.li:hover,button.li:hover{background:var(--bg-subtle)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600}
.li .t span{display:block;font-size:13px;color:var(--fg-muted)}
.li>.ic{color:var(--fg-muted)}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border-strong);flex:none;display:grid;place-items:center;color:#fff}
.dot.done{background:var(--success-em);border-color:var(--success-em)}
.dot.done .ic{width:12px;height:12px;stroke-width:3}
.dot.known{border-color:var(--fg-subtle);border-style:dashed}
.dot.now{border-color:var(--attention-em);box-shadow:0 0 0 3px var(--attention-subtle)}
.seg{display:inline-flex;background:var(--bg-muted);border:1px solid var(--border);border-radius:6px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:1px solid transparent;background:transparent;border-radius:5px;padding:5px 12px;font-size:14px;font-weight:500;cursor:pointer;color:var(--fg-muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--fg);border-color:var(--border);box-shadow:var(--shadow-sm);font-weight:600}
.tabs-in{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--border-muted);scrollbar-width:none;-ms-overflow-style:none}
.tabs-in::-webkit-scrollbar{display:none}
.tabs-in button,.tabs-in a{flex:none;display:inline-flex;align-items:center;gap:6px;position:relative;border:0;background:none;border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:14px;color:var(--fg);cursor:pointer;white-space:nowrap}
.tabs-in button:hover,.tabs-in a:hover{background:var(--bg-muted)}
.tabs-in [aria-selected="true"]{font-weight:600}
.tabs-in [aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:-7px;height:2px;border-radius:6px;background:var(--unl)}
.tabs-in .ic{color:var(--fg-muted)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lab{font-size:14px;font-weight:600;color:var(--fg)}
.inp,select.inp,textarea.inp{width:100%;min-height:40px;border:1px solid var(--border);border-radius:6px;background:var(--bg);padding:8px 12px;font-size:16px;color:var(--fg);box-shadow:inset 0 1px 0 rgba(208,215,222,.2)}
:root[data-theme="dark"] .inp{background:var(--bg-inset)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .inp{background:var(--bg-inset)}}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:15px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tbl{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:6px 12px;text-align:left;border:1px solid var(--border);vertical-align:top}
.tbl th{font-weight:600;background:var(--bg-subtle);hyphens:manual;overflow-wrap:break-word}
@media (max-width:600px){.tbl th,.tbl td{padding:6px 8px}table.tbl{font-size:13.5px}}
.tbl tbody tr:nth-child(2n){background:var(--bg-subtle)}
.tbl td.c,.tbl th.c{text-align:center}
.tbl td.r,.tbl th.r{text-align:right}
.tbl caption{caption-side:bottom;text-align:left;font-size:12.5px;color:var(--fg-muted);padding:8px 2px}
.svgbox{position:relative;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);overflow:auto;max-height:78vh;-webkit-overflow-scrolling:touch}
.svgbox svg{display:block}
.zoombar{position:sticky;left:0;top:0;z-index:2;display:flex;gap:6px;padding:6px;pointer-events:none}
.zoombar button{pointer-events:auto;width:34px;height:34px;border-radius:6px;border:1px solid var(--btn-border);background:var(--btn-bg);cursor:pointer;font-weight:600;font-size:17px;box-shadow:var(--shadow-md);color:var(--fg)}
.empty{border:1px dashed var(--border-strong);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--fg-muted)}
.empty .ic{width:24px;height:24px;color:var(--fg-subtle);display:block;margin:0 auto 8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--font-mono);font-size:22px;font-weight:600}
.stat span{font-size:12.5px;color:var(--fg-muted)}
.kbd{font-family:var(--font-mono);font-size:12px;border:1px solid var(--border);border-bottom-width:2px;border-radius:6px;padding:0 5px;background:var(--bg-subtle)}
hr.sep{border:0;border-top:1px solid var(--border-muted);margin:8px 0}
details.acc{border:1px solid var(--border);border-radius:var(--r);background:var(--bg)}
details.acc>summary{cursor:pointer;padding:12px 16px;font-weight:600;list-style:none;display:flex;gap:10px;align-items:center}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:"";width:8px;height:8px;margin-left:auto;border-right:2px solid var(--fg-muted);border-bottom:2px solid var(--fg-muted);transform:rotate(45deg) translate(-2px,-2px);transition:transform .15s ease;flex:none}
details.acc[open]>summary::after{transform:rotate(-135deg) translate(-2px,-2px)}
details.acc>.in{padding:0 16px 16px}
.flash{border:1px solid var(--accent-muted);background:var(--accent-subtle);border-radius:6px;padding:12px 16px;font-size:14px}
.flash.ok{border-color:color-mix(in srgb,var(--success) 40%,transparent);background:var(--success-subtle)}
.flash.warn{border-color:color-mix(in srgb,var(--attention) 40%,transparent);background:var(--attention-subtle)}
.flash.bad{border-color:color-mix(in srgb,var(--danger) 40%,transparent);background:var(--danger-subtle)}

/* ---------- аватар, уровень, XP ---------- */
.ava{display:inline-block;border-radius:50%;overflow:hidden;background:var(--bg-subtle);box-shadow:0 0 0 1px var(--border);flex:none}
.ava svg{display:block;width:100%;height:100%}
.ava-ring{position:relative;flex:none;display:grid;place-items:center}
.ava-ring>svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ava-ring .lvtag{position:absolute;right:-4px;bottom:-2px;font-family:var(--font-pixel);font-size:10px;line-height:1;padding:5px 6px 4px;border-radius:999px;color:#fff;background:linear-gradient(135deg,var(--lvl-a),var(--lvl-b));box-shadow:0 0 0 3px var(--bg)}
.lobby{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.lobby .nm{font-size:22px;font-weight:600;line-height:1.2}
.lobby .rk{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.rank{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--done)}
.xpline{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--fg-muted)}
.xpline b{font-family:var(--font-pixel);font-size:10px;font-weight:400;color:var(--fg)}
.stats4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.st{border:1px solid var(--border);border-radius:6px;padding:10px 8px;text-align:center;background:var(--bg)}
.st b{display:block;font-family:var(--font-pixel);font-size:15px;font-weight:400;line-height:1.3}
.st{display:block;color:var(--fg)}
.st span{display:block;font-size:11.5px;line-height:1.25;color:var(--fg-muted);margin-top:5px}
.st.fl b{color:var(--flame)} .st.xp b{color:var(--gold)} .st.ac b{color:var(--done)} .st.ls b{color:var(--success)}
.cta{display:flex;align-items:center;gap:14px;border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;background:linear-gradient(135deg,color-mix(in srgb,var(--xp-a) 14%,var(--bg)),var(--bg) 60%)}
.cta .t{flex:1;min-width:0}
.cta .t b{display:block;font-size:16px;font-weight:600}
.cta .t span{display:block;font-size:13px;color:var(--fg-muted)}
.quest{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:12px 16px}
.quest+.quest{border-top:1px solid var(--border-muted)}
.quest .qi{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;background:var(--bg-muted);color:var(--fg-muted)}
.quest .qi .ic{width:16px;height:16px}
.quest.ok .qi{background:var(--success-em);color:#fff}
.quest .qt2{font-size:14px;font-weight:500}
.quest.ok .qt2{color:var(--fg-muted);text-decoration:line-through}
.quest .bar{height:6px;margin-top:6px}
.heat-wrap{overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,11px);gap:3px;width:max-content}
.heat i{width:11px;height:11px;border-radius:2px;background:var(--h0);outline:1px solid rgba(27,31,35,.06);outline-offset:-1px}
.heat i[data-l="1"]{background:var(--h1)} .heat i[data-l="2"]{background:var(--h2)} .heat i[data-l="3"]{background:var(--h3)} .heat i[data-l="4"]{background:var(--h4)}
.heat i.pad{visibility:hidden}
.heat i.today{outline:1.5px solid var(--fg-muted)}
.heat-leg{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--fg-muted);justify-content:flex-end;margin-top:6px}
.heat-leg i{width:11px;height:11px;border-radius:2px;background:var(--h0)}
.ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ach{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 10px 12px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg)}
.ach .medal{width:56px;height:56px}
.ach b{font-size:13px;font-weight:600;line-height:1.25}
.ach span{font-size:12px;color:var(--fg-muted);line-height:1.3}
.ach .rar{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.ach.locked .medal{filter:grayscale(1);opacity:.5}
.ach.locked b{color:var(--fg-muted)}
.ach[data-r="c"] .rar{color:var(--r-c)} .ach[data-r="r"] .rar{color:var(--r-r)} .ach[data-r="e"] .rar{color:var(--r-e)} .ach[data-r="l"] .rar{color:var(--r-l)}
.ach[data-r="l"]:not(.locked){border-color:color-mix(in srgb,var(--r-l) 55%,var(--border));box-shadow:0 0 0 1px color-mix(in srgb,var(--r-l) 25%,transparent),0 4px 14px color-mix(in srgb,var(--r-l) 18%,transparent)}
.ach[data-r="e"]:not(.locked){border-color:color-mix(in srgb,var(--r-e) 45%,var(--border))}
.ach-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.ach-row::-webkit-scrollbar{display:none}
.ach-row .medal{width:44px;height:44px;flex:none}
.ach-row .medal.locked{filter:grayscale(1);opacity:.45}

/* ---------- курс как карта уровней ---------- */
.mod{border:1px solid var(--border);border-radius:var(--r);background:var(--bg);overflow:hidden}
.mod+.mod{margin-top:12px}
.mod>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.mod>summary::-webkit-details-marker{display:none}
.mod>summary:hover{background:var(--bg-subtle)}
.mod[open]>summary{border-bottom:1px solid var(--border-muted);background:var(--bg-subtle)}
.node{position:relative;width:52px;height:52px;display:grid;place-items:center}
.node svg{position:absolute;inset:0;transform:rotate(-90deg)}
.node b{font-family:var(--font-pixel);font-size:13px;font-weight:400;color:var(--fg)}
.node.full b{color:var(--success)}
.mod .mt b{display:block;font-size:15px;font-weight:600;line-height:1.3}
.mod .mt span{display:block;font-size:13px;color:var(--fg-muted);margin-top:2px}
.stars{display:inline-flex;gap:1px;font-size:14px;letter-spacing:0;line-height:1;color:var(--border-strong)}
.stars .on{color:var(--gold)}
.mod .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--fg-muted);font-family:var(--font-mono)}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;color:var(--fg)}
.lrow+.lrow{border-top:1px solid var(--border-muted)}
.lrow:hover{background:var(--bg-subtle)}
.lrow .t{flex:1;min-width:0}
.lrow .t b{display:block;font-weight:500;font-size:15px}
.lrow .t span{display:block;font-size:12.5px;color:var(--fg-muted)}

/* ---------- практика: проекты как репозитории, игры как аркада ---------- */
.card.repo{display:flex;flex-direction:column;gap:8px;min-height:120px}
.repo .rt{display:flex;align-items:center;gap:8px;color:var(--accent);font-weight:600}
.repo .rt .ic{color:var(--fg-muted)}
.repo p{font-size:13px;color:var(--fg-muted);flex:1}
.repo .rf{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--fg-muted);flex-wrap:wrap}
.lang{display:inline-flex;align-items:center;gap:5px}
.lang i{width:10px;height:10px;border-radius:50%;display:inline-block}
.grid.games{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.arcade{position:relative;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;background:var(--bg);color:var(--fg);transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.arcade:hover{border-color:var(--border-strong);box-shadow:var(--shadow-lg)}
@media (hover:hover){.arcade:hover{transform:translateY(-2px)}}
.arcade .art{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:#fff;background:var(--g1,#1f6feb);background:linear-gradient(135deg,var(--g1,#1f6feb),var(--g2,#54aeff));position:relative;overflow:hidden}
.arcade .art::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 4px);pointer-events:none}
.arcade .art .ic{width:34px;height:34px;stroke-width:1.6;filter:drop-shadow(0 2px 0 rgba(0,0,0,.25))}
.arcade .art .lvlb{font-family:var(--font-pixel);font-size:9px;background:rgba(0,0,0,.28);padding:5px 7px 4px;border-radius:4px;letter-spacing:.04em}
.arcade .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.arcade .bd b{font-weight:600}
.arcade .bd p{font-size:13px;color:var(--fg-muted);flex:1}
.arcade .ft{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--fg-muted)}
.arcade .play{margin-left:auto;font-family:var(--font-pixel);font-size:9px;color:var(--success);letter-spacing:.04em;white-space:nowrap}
.medal-s{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:9px;font-weight:700;color:#3b2a00;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
.medal-s.b1{background:linear-gradient(135deg,#e2a26b,#a8643a);color:#fff}
.medal-s.b2{background:linear-gradient(135deg,#f4f6f8,#aab4bf)}
.medal-s.b3{background:linear-gradient(135deg,#ffe58a,#e0a800)}
.boss{position:absolute;top:10px;right:10px;font-family:var(--font-pixel);font-size:8px;color:#fff;background:#cf222e;padding:5px 6px 4px;border-radius:4px;box-shadow:0 2px 0 rgba(0,0,0,.3);z-index:1}

/* ---------- тесты и игры ---------- */
.quiz{display:flex;flex-direction:column;gap:12px}
.q{background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.q .qt{font-weight:600;margin-bottom:12px;line-height:1.45}
.opts{display:flex;flex-direction:column;gap:8px}
